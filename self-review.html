*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:#f0fdfa;color:#0f172a;min-height:100vh}
/* ── Gate ── */
.gate{min-height:100vh;background:linear-gradient(160deg,#042f2e 0%,#134e4a 50%,#042f2e 100%);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.gate h1{font-size:28px;font-weight:800;color:#f0fdfa;margin:0 0 8px}
.gate .sub{color:#5eead4;font-size:14px;margin:0 0 28px;line-height:1.6;opacity:.7}
.gate .tag{font-size:13px;letter-spacing:3px;color:#5eead4;margin-bottom:12px;font-weight:600}
.gate-field{margin-bottom:16px;text-align:left;max-width:320px;width:100%;margin-left:auto;margin-right:auto}
.gate-label{font-size:12px;color:#5eead4;margin-bottom:6px;font-weight:500;opacity:.8}
.gate-input{width:100%;padding:14px 18px;border:1.5px solid #115e59;border-radius:12px;background:#042f2e;color:#f0fdfa;font-size:15px;font-family:inherit;outline:none;transition:border .2s}
.gate-input:focus{border-color:#14b8a6}
.gate-input::placeholder{color:#0f766e}
.gate-code{letter-spacing:4px;text-align:center;font-size:18px;text-transform:uppercase}
.gate-error{color:#fb7185;font-size:13px;margin-top:8px;min-height:20px;text-align:center}
.gate-btn{padding:12px 32px;border-radius:12px;background:#14b8a6;color:#042f2e;font-size:14px;font-weight:700;border:none;cursor:pointer;font-family:inherit;margin-top:8px;transition:background .2s;width:100%;max-width:320px}
.gate-btn:hover{background:#2dd4bf}
/* ── Landing ── */
.landing{min-height:100vh;background:linear-gradient(160deg,#042f2e 0%,#134e4a 50%,#042f2e 100%);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.landing h1{font-size:32px;font-weight:800;color:#f0fdfa;margin:0 0 8px}
.landing .sub{color:#5eead4;font-size:14px;margin:0 0 32px;line-height:1.6;opacity:.7}
.landing .tag{font-size:13px;letter-spacing:3px;color:#5eead4;margin-bottom:12px;font-weight:600}
.landing .welcome{color:#2dd4bf;font-size:14px;margin-bottom:28px;font-weight:500}
.phase-label{font-size:12px;color:#5eead4;opacity:.7;text-align:left;max-width:520px;margin:0 auto 8px;font-weight:600;letter-spacing:1px}
.mode-btn{width:100%;padding:18px 24px;border-radius:14px;border:1.5px solid #115e59;background:linear-gradient(135deg,#134e4a,#115e59);color:#f0fdfa;font-size:16px;font-weight:700;cursor:pointer;text-align:left;display:flex;align-items:center;justify-content:space-between;transition:border-color .2s;margin-bottom:12px;font-family:inherit}
.mode-btn:hover{border-color:#14b8a6}
.mode-btn .desc{font-size:12px;font-weight:400;color:#5eead4;margin-top:4px;opacity:.8}
.mode-btn .arrow{font-size:22px;color:#2dd4bf}
.draft-badge{display:inline-block;padding:2px 8px;border-radius:6px;background:#fef3c7;color:#92400e;font-size:11px;font-weight:600;margin-left:8px}
/* ── Header ── */
.header{background:#042f2e;padding:16px 24px;position:sticky;top:0;z-index:20}
.header-inner{max-width:720px;margin:0 auto}
.header .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.header .brand{font-size:11px;letter-spacing:2px;color:#0d9488}
.header h2{margin:2px 0 0;font-size:17px;font-weight:700;color:#f0fdfa}
.header-btns{display:flex;gap:8px}
.exit-btn,.save-btn{background:none;border:1px solid #115e59;border-radius:8px;padding:6px 14px;color:#5eead4;font-size:12px;cursor:pointer;font-family:inherit;transition:all .2s}
.save-btn{border-color:#0d9488;color:#2dd4bf}
.save-btn:hover{background:#0d9488;color:#042f2e}
.progress-bar{height:3px;background:#134e4a;border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#14b8a6,#5eead4);border-radius:2px;transition:width .4s ease}
/* ── Section Nav (sticky pills) ── */
.section-nav{position:sticky;top:68px;z-index:15;background:rgba(240,253,250,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #ccfbf1;padding:10px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.section-nav::-webkit-scrollbar{display:none}
.nav-inner{max-width:720px;margin:0 auto;padding:0 20px;display:flex;gap:6px}
.nav-pill{flex-shrink:0;padding:6px 14px;font-size:12px;font-weight:600;color:#5b7c79;background:#fff;border:1.5px solid #ccfbf1;border-radius:20px;cursor:pointer;transition:all .15s;white-space:nowrap;font-family:inherit}
.nav-pill:hover{border-color:#5eead4;color:#0d9488}
.nav-pill.active{background:#14b8a6;color:#fff;border-color:#14b8a6}
.nav-pill.filled{background:#ecfdf5;color:#059669;border-color:#6ee7b7}
/* ── Content ── */
.content{max-width:720px;margin:0 auto;padding:24px 20px 80px}
/* ── Phase banner ── */
.phase-banner{background:linear-gradient(135deg,#0d9488,#14b8a6);border-radius:14px;padding:14px 20px;margin-bottom:20px;color:#fff}
.phase-banner .pb-t{font-size:14px;font-weight:800;margin-bottom:2px}
.phase-banner .pb-d{font-size:12px;opacity:.9;line-height:1.5}
/* ── Card ── */
.card{background:#fff;border-radius:16px;border:1px solid #d1ece8;overflow:hidden;margin-bottom:20px;box-shadow:0 1px 4px rgba(13,148,136,.05);scroll-margin-top:120px}
.card-header{padding:18px 24px;border-bottom:1px solid #f0fdfa;background:#fafefd;display:flex;align-items:center;justify-content:space-between}
.card-header h3{font-size:16px;font-weight:700}
.card-header .step{font-size:12px;color:#5b7c79}
.card-sub{font-size:13px;color:#5b7c79;margin-top:4px}
.card-body{padding:20px 24px}
/* ── Fields ── */
.field{margin-bottom:20px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:14px;font-weight:600;color:#0f172a;margin-bottom:6px;line-height:1.5;white-space:pre-line}
.field-hint{font-size:12.5px;color:#0d9488;background:#f0fdfa;border:1px solid #ccfbf1;border-radius:8px;padding:8px 11px;margin-bottom:8px;line-height:1.55;white-space:pre-line}
/* 점수화 UI */
.score-label{font-size:13px;font-weight:700;color:#0f172a;margin:6px 0 8px}
.rubric-grid{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.rubric-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1.5px solid #e2e8f0;border-radius:10px;background:#fff;cursor:pointer;transition:all .12s}
.rubric-item:hover{border-color:#5eead4}
.rubric-item.active{border-color:#0d9488;background:#f0fdfa}
.rb-n{flex-shrink:0;font-size:13px;font-weight:800;color:#0d9488;min-width:30px}
.rb-d{font-size:12.5px;color:#334155;line-height:1.45}
.add-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:16px}
.add-item{padding:10px 8px;border:1.5px solid #e2e8f0;border-radius:10px;background:#fff;cursor:pointer;text-align:center;transition:all .12s}
.add-item:hover{border-color:#5eead4}
.add-item.active{border-color:#7c3aed;background:#f5f3ff}
.ad-v{display:block;font-size:14px;font-weight:800;color:#7c3aed}
.ad-l{display:block;font-size:12px;font-weight:600;color:#1e293b;margin-top:2px}
.ad-d{display:block;font-size:10.5px;color:#94a3b8;margin-top:2px;line-height:1.3}
.axis-score{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:10px;background:#0f172a;color:#f8fafc}
.as-label{font-size:12px;color:#94a3b8}
.as-val{font-size:18px;font-weight:800;color:#2dd4bf}
.as-nomid{font-size:11px;color:#64748b}
.delta{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px}
.delta-up{background:#052e2b;color:#34d399}
.delta-down{background:#3f1d1d;color:#f87171}
.delta-same{background:#1e293b;color:#cbd5e1}
.delta-none{background:#1e293b;color:#94a3b8}
/* 종합 대시보드 */
.dash{padding:20px;border-radius:14px;background:linear-gradient(160deg,#0f172a,#134e4a);color:#f8fafc;margin-bottom:20px}
.dash-total{text-align:center;margin-bottom:4px}
.dt-num{font-size:46px;font-weight:800;color:#2dd4bf;line-height:1}
.dt-max{font-size:18px;color:#64748b}
.dash-grade{text-align:center;font-size:14px;font-weight:700;color:#5eead4;margin-bottom:18px}
.dash-list{display:flex;flex-direction:column;gap:9px}
.dash-row{display:flex;align-items:center;gap:10px}
.dr-name{flex-shrink:0;width:88px;font-size:12px;color:#cbd5e1}
.dr-bar{flex:1;height:9px;border-radius:5px;background:#1e293b;overflow:hidden}
.dr-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,#0d9488,#2dd4bf);transition:width .4s}
.dr-val{flex-shrink:0;width:26px;text-align:right;font-size:13px;font-weight:700;color:#f8fafc}
.dr-delta{flex-shrink:0;width:34px;text-align:right;font-size:11px;font-weight:700}
.dash-compare{margin-top:16px;padding-top:14px;border-top:1px solid #1e3a37;text-align:center;font-size:13px;font-weight:600;color:#5eead4}
@media(max-width:480px){.add-row{grid-template-columns:1fr}}
.field input::placeholder,.field textarea::placeholder{color:#94c9c2}
.field .req{color:#ef4444}
.field input,.field textarea{width:100%;padding:10px 14px;border:1.5px solid #d1ece8;border-radius:10px;font-size:14px;font-family:inherit;background:#fafefd;transition:border .2s;outline:none}
.field textarea{resize:vertical;line-height:1.7;min-height:120px}
.field input:focus,.field textarea:focus{border-color:#14b8a6}
/* ── Guide Box ── */
.guide-box{padding:16px;border-radius:12px;background:#f0fdfa;border:1px solid #ccfbf1;margin-bottom:20px}
.guide-box .title{font-size:13px;font-weight:700;color:#0f766e;margin-bottom:10px}
.guide-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.guide-num{width:26px;height:26px;border-radius:8px;background:#14b8a6;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.guide-text{font-size:12px;color:#334155}
.guide-text strong{color:#0f172a}
.guide-text span{color:#5b7c79}
/* ── Grade ── */
.grade-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.grade-item{padding:10px 14px;border-radius:10px;background:#fff;border:2px solid #d1ece8;cursor:pointer;transition:all .15s}
.grade-item:hover{border-color:#5eead4}
.grade-item.active{border-color:#14b8a6;background:#f0fdfa}
.grade-item .g{font-size:14px;font-weight:800;color:#0d9488}
.grade-item .gl{font-size:12px;font-weight:600;color:#0f172a;margin-left:4px}
.grade-item .gd{font-size:11px;color:#5b7c79;margin-top:3px;line-height:1.4}
/* ── Hire decision ── */
.hire-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.hire-item{padding:14px 10px;border-radius:10px;background:#fff;border:2px solid #d1ece8;cursor:pointer;transition:all .15s;text-align:center}
.hire-item:hover{border-color:#5eead4}
.hire-item.active.fit{border-color:#059669;background:#ecfdf5}
.hire-item.active.hold{border-color:#d97706;background:#fffbeb}
.hire-item.active.unfit{border-color:#dc2626;background:#fef2f2}
.hire-item .hl{font-size:14px;font-weight:800;color:#0f172a}
.hire-item .hd{font-size:11px;color:#5b7c79;margin-top:3px;line-height:1.3}
/* ── Goal achievement ── */

.goal-rate input{width:120px;text-align:center;font-size:18px;font-weight:800;color:#0d9488}
.goal-rate .unit{font-size:16px;font-weight:700;color:#0f766e}
/* ── Core Value ── */
.cv-card{padding:20px;border-radius:14px;margin-bottom:16px}
.cv-title{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cv-title .kr{font-size:20px;font-weight:800}
.cv-title .en{font-size:13px;opacity:.7;font-weight:500}
.cv-behaviors{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.cv-behaviors span{padding:3px 10px;border-radius:6px;border:none;font-size:11px;color:#5b7c79}
.cv-q{font-size:13px;font-weight:600;color:#0f172a;margin-bottom:6px}
.scale-row{display:flex;gap:8px;margin:8px 0 16px;flex-wrap:wrap}
.scale-btn{width:52px;padding:8px 0;border-radius:10px;border:2px solid #d1ece8;background:#fff;color:#5b7c79;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit}
.scale-btn.active{color:#fff}
.scale-btn .sl{font-size:9px;font-weight:500;opacity:.9}
/* ── Submit Bar ── */
.submit-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d1ece8;padding:12px 20px;z-index:10}
.submit-inner{max-width:720px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.submit-info{font-size:12px;color:#5b7c79}
.submit-info .count{font-weight:700;color:#0d9488}
.submit-info .done-count{color:#059669}
.btn-submit{padding:10px 32px;border-radius:10px;border:none;background:#14b8a6;color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-submit:hover{background:#0d9488}
.btn-submit:disabled{background:#cbd5e1;cursor:default}
/* ── Toast ── */
.saved-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#059669;color:#fff;padding:10px 24px;border-radius:10px;font-size:13px;font-weight:600;z-index:100;animation:fadeout 2s forwards}
@keyframes fadeout{0%,70%{opacity:1}100%{opacity:0}}
/* ── Done ── */
.done{min-height:100vh;background:linear-gradient(160deg,#042f2e 0%,#134e4a 50%,#042f2e 100%);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.done .icon{font-size:56px;margin-bottom:16px}
.done h2{color:#f0fdfa;font-size:24px;font-weight:800;margin:0 0 8px}
.done p{color:#5eead4;font-size:14px;margin:0 0 32px;line-height:1.6;opacity:.8}
.done button{padding:14px 32px;border-radius:12px;background:#14b8a6;color:#042f2e;font-size:14px;font-weight:700;border:none;cursor:pointer;font-family:inherit}
/* ── Section Divider ── */
.section-divider{height:4px;border-radius:2px;margin:8px 0 20px;background:linear-gradient(90deg,#14b8a622,#14b8a608)}
/* ── Scroll to top ── */
.scroll-top{position:fixed;bottom:70px;right:20px;width:40px;height:40px;border-radius:50%;background:#14b8a6;color:#fff;border:none;cursor:pointer;font-size:18px;display:none;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(20,184,166,.3);z-index:10;transition:opacity .2s}
.scroll-top.show{display:flex}
@media(max-width:480px){
.landing h1,.gate h1{font-size:26px}
.grade-grid,.hire-grid{grid-template-columns:1fr}
.scale-row{gap:5px}
.scale-btn{width:44px;font-size:12px}
.nav-pill{padding:5px 11px;font-size:11px}
}
</style>

// 점수 계산
// 셀프:  기본점수(1~5) × 4         = 4·8·12·16·20
// 평가자: (기본점수 + 시도추가점) × 3, 상한 20  (예: 5+2→20, 4+1→15, 3+0→9)
function axisScore(ax,m){
  const base=D[ax.key+'_base'];
  if(!base)return null;
  if(m==='self') return base*4;
  const add=D[ax.key+'_add']!==undefined?D[ax.key+'_add']:0;
  return Math.min(ax.max, (base+add)*3);
}
function totalScore(m){
  let sum=0,done=0;
  AXES.forEach(ax=>{const s=axisScore(ax,m);if(s!==null){sum+=s;done++}});
  return {sum,done,complete:done===AXES.length};
}
// 총점 → 본채용 권장 등급
function gradeOf(total){
  if(total>=85)return GG[0];
  if(total>=70)return GG[1];
  if(total>=55)return GG[2];
  return GG[3];
}

function showToast(msg){const t=document.createElement('div');t.className='saved-toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

// ═══ 섹션 완료 체크 ═══
function isSectionFilled(sec){
  if(sec.tp==='cv') return CV.every(v=>D[v.en+'_score']&&(D[v.en+'_text']||'').trim());
  if(sec.tp==='goalset') return sec.f.every(f=>(D[f.k]||'').trim());
  if(sec.tp==='goal') return sec.f.every(f=>(D[f.k]||'').trim());
  if(sec.tp==='score'){
    const ax=sec.ax,base=D[ax.key+'_base'],txt=(D[ax.key+'_text']||'').trim();
    if(sec.mode==='self') return !!base&&!!txt;
    return !!base&&D[ax.key+'_add']!==undefined&&!!txt;
  }
  if(sec.tp==='final') return (sec.mode==='self'||D.hire)&&sec.f&&sec.f.every(f=>(D[f.k]||'').trim());
  if(sec.f) return sec.f.filter(f=>!f.opt).every(f=>(D[f.k]||'').trim());
  return false;
}
function allFilled(){return getSections().every(s=>isSectionFilled(s))}
function filledCount(){return getSections().filter(s=>isSectionFilled(s)).length}

// ═══ Helpers ═══
function h(t,a,...ch){const e=document.createElement(t);if(a)Object.entries(a).forEach(([k,v])=>{if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k.startsWith('on'))e.addEventListener(k.slice(2).toLowerCase(),v);else if(k==='className')e.className=v;else e.setAttribute(k,v)});ch.flat(Infinity).forEach(x=>{if(x!=null)e.appendChild(typeof x==='string'?document.createTextNode(x):x)});return e}

// 중간 리뷰 점수 스냅샷 조회 (같은 작성자·같은 트랙의 mid 점수)
function midSnapshotKey(m){return 'gna_ob_midscore_'+m+'_'+authEmail}
function loadMidScores(m){try{const raw=localStorage.getItem(midSnapshotKey(m));return raw?JSON.parse(raw):null}catch(e){return null}}

// ═══ Submit ═══
async function submit(){
  if(!allFilled()){showToast('⚠️ 미작성 항목이 있습니다');return}
  if(!confirm('제출하시겠습니까? 제출 후에는 수정할 수 없습니다.'))return;
  saving=true;updateSubmitBar();
  const tot=totalScore(mode);
  const scores={};AXES.forEach(ax=>scores[ax.key]=axisScore(ax,mode));
  const ts=new Date().toISOString(),p={...D,_form:'self',_phase:phase,_type:mode,_email:authEmail,_total:tot.sum,_scores:scores,_timestamp:ts};
  try{localStorage.setItem('gna_ob_'+phase+'_'+mode+'_'+ts,JSON.stringify(p))}catch(e){}
  // 중간 리뷰면, 마무리에서 비교할 수 있도록 점수 스냅샷 저장
  if(phase==='mid')try{localStorage.setItem(midSnapshotKey(mode),JSON.stringify({scores,total:tot.sum,ts}))}catch(e){}
  if(SHEET_WEBHOOK_URL)try{await fetch(SHEET_WEBHOOK_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)})}catch(e){}
  clearDraft();saving=false;submitted=true;R();
}

// ── 점수 평가 카드 (한 축) ──
function rScore(sec){
  const ax=sec.ax,m=sec.mode,self=m==='self';
  const wrap=h('div',null);
  // 질문
  const q=h('div',{className:'field'});
  const ql=h('label',null,self?ax.selfQ:ax.evalQ);ql.appendChild(h('span',{className:'req'},' *'));
  q.appendChild(ql);
  const ta=h('textarea',{rows:'4'});ta.value=D[ax.key+'_text']||'';
  if(ax.ph)ta.setAttribute('placeholder',ax.ph);
  ta.addEventListener('input',e=>{D[ax.key+'_text']=e.target.value;updateNav();updateSubmitBar()});
  q.appendChild(ta);wrap.appendChild(q);
  // 기본점수 (1~5 루브릭)
  const bk=ax.key+'_base';
  const bl=h('div',{className:'score-label'},self?'위 기재한 내용에 대한 셀프 평가를 해주세요':'기본 점수 (1~5)');bl.appendChild(h('span',{className:'req'},' *'));wrap.appendChild(bl);
  const grid=h('div',{className:'rubric-grid'});
  // 점수와 설명을 묶어 항목 구성 (점수값은 항상 설명에 고정)
  let items=ax.rubric.map((desc,idx)=>({n:5-idx,desc:desc}));
  // 셀프는 선택지 순서를 랜덤 배치 (섹션별로 한 번만 고정 → 리렌더해도 동일)
  if(self){
    if(!RUBRIC_ORDER[ax.key]){
      const order=items.map((_,i)=>i);
      for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
      RUBRIC_ORDER[ax.key]=order;
    }
    items=RUBRIC_ORDER[ax.key].map(i=>items[i]);
  }
  items.forEach(item=>{
    const n=item.n;
    const a=D[bk]===n;
    const it=h('div',{className:'rubric-item'+(a?' active':''),onClick:()=>{D[bk]=n;reRenderSection(sec.id);updateNav();updateSubmitBar()}});
    if(!self)it.appendChild(h('span',{className:'rb-n'},n+'점'));
    it.appendChild(h('span',{className:'rb-d'},item.desc));
    grid.appendChild(it);
  });
  wrap.appendChild(grid);
  // 평가자: 해결/실행 시도 추가점
  if(!self){
    const ak=ax.key+'_add';
    wrap.appendChild(h('div',{className:'score-label'},'+ 해결·실행 시도 가산 (0~2)',h('span',{className:'req'},' *')));
    const arow=h('div',{className:'add-row'});
    ADD.forEach(a=>{
      const on=D[ak]===a.v;
      const b=h('div',{className:'add-item'+(on?' active':''),onClick:()=>{D[ak]=a.v;reRenderSection(sec.id);updateNav();updateSubmitBar()}});
      b.appendChild(h('span',{className:'ad-v'},'+'+a.v));
      b.appendChild(h('span',{className:'ad-l'},a.l));
      b.appendChild(h('span',{className:'ad-d'},a.d));
      arow.appendChild(b);
    });
    wrap.appendChild(arow);
  }
  // 이 축 점수 + (마무리) 중간 대비 변화 — 셀프에는 점수를 노출하지 않음
  if(!self){
    const sc=axisScore(ax,m);
    const scBox=h('div',{className:'axis-score'});
    scBox.appendChild(h('span',{className:'as-label'},'이 항목 점수'));
    scBox.appendChild(h('span',{className:'as-val'},(sc===null?'—':sc)+' / 20'));
    if(sec.phaseTag==='final'){
      const mid=loadMidScores(m);
      if(mid&&mid.scores&&mid.scores[ax.key]!=null){
        scBox.appendChild(rDelta(mid.scores[ax.key],sc));
      }else{
        scBox.appendChild(h('span',{className:'as-nomid'},'중간 점수 없음'));
      }
    }
    wrap.appendChild(scBox);
  }
  return wrap;
}
// 변화 배지
function rDelta(prev,cur){
  if(cur===null)return h('span',{className:'delta delta-none'},'중간 '+prev+'점');
  const d=cur-prev;
  const cls=d>0?'delta-up':d<0?'delta-down':'delta-same';
  const arrow=d>0?'▲':d<0?'▼':'＝';
  const txt=d>0?('중간 '+prev+' → '+cur+'  '+arrow+'+'+d):d<0?('중간 '+prev+' → '+cur+'  '+arrow+d):('중간과 동일 '+cur);
  return h('span',{className:'delta '+cls},txt);
}
// 종합 점수 대시보드
function rScoreDash(m){
  const self=m==='self';
  const box=h('div',{className:'dash'});
  const tot=totalScore(m);
  const g=gradeOf(tot.sum);
  box.appendChild(h('div',{className:'dash-total'},h('span',{className:'dt-num'},String(tot.sum)),h('span',{className:'dt-max'},' / 100')));
  box.appendChild(h('div',{className:'dash-grade'},'권장 등급  '+g.g+'. '+g.l));
  // 항목별 막대
  const list=h('div',{className:'dash-list'});
  const mid=loadMidScores(m);
  AXES.forEach(ax=>{
    const sc=axisScore(ax,m);
    const row=h('div',{className:'dash-row'});
    row.appendChild(h('span',{className:'dr-name'},ax.icon+' '+ax.t.split(' ')[0]));
    const barWrap=h('div',{className:'dr-bar'});
    const fill=h('div',{className:'dr-fill',style:{width:((sc||0)/20*100)+'%'}});barWrap.appendChild(fill);
    row.appendChild(barWrap);
    row.appendChild(h('span',{className:'dr-val'},(sc===null?'—':sc)));
    if(phase==='final'&&mid&&mid.scores&&mid.scores[ax.key]!=null&&sc!==null){
      const d=sc-mid.scores[ax.key];
      row.appendChild(h('span',{className:'dr-delta '+(d>0?'delta-up':d<0?'delta-down':'delta-same')},d>0?('+'+d):d<0?String(d):'='));
    }
    list.appendChild(row);
  });
  box.appendChild(list);
  if(phase==='final'&&mid&&mid.total!=null){
    const d=tot.sum-mid.total;
    box.appendChild(h('div',{className:'dash-compare'},'중간 총점 '+mid.total+'점 → 마무리 '+tot.sum+'점  '+(d>0?('▲ +'+d+' 개선'):d<0?('▼ '+d):'동일')));
  }
  return box;
}
function renderSectionCard(sec,idx){
  const ss=getSections();
  const card=h('div',{className:'card',id:'sec-'+sec.id});
  const ch2=h('div',{className:'card-header'}),td=h('div');
  td.appendChild(h('h3',null,sec.t));
  if(sec.sub)td.appendChild(h('div',{className:'card-sub'},sec.sub));
  ch2.appendChild(td);
  ch2.appendChild(h('span',{className:'step'},(idx+1)+' / '+ss.length));
  card.appendChild(ch2);
  const bd=h('div',{className:'card-body'});
  if(sec.tp==='cv'){
    bd.appendChild(rScaleGuide(SI));
    CV.forEach(v=>bd.appendChild(rCV(v,sec.mode)));
  } else if(sec.tp==='score'){
    bd.appendChild(rScore(sec));
  } else if(sec.tp==='goalset'){
    sec.f.forEach(f=>bd.appendChild(rField(f)));
  } else if(sec.tp==='goal'){
    sec.f.forEach(f=>bd.appendChild(rField(f)));
  } else if(sec.tp==='final'){
    if(sec.mode!=='self'){bd.appendChild(rScoreDash(sec.mode));bd.appendChild(rHire());}
    sec.f.forEach(f=>bd.appendChild(rField(f)));
  } else if(sec.f){
    sec.f.forEach(f=>bd.appendChild(rField(f)));
  }
  card.appendChild(bd);
  return card;
}
function reRenderSection(secId){
  const ss=getSections();
  const idx=ss.findIndex(s=>s.id===secId);
  if(idx<0)return;
  const old=document.getElementById('sec-'+secId);
  if(!old)return;
  old.replaceWith(renderSectionCard(ss[idx],idx));
  // 점수 축이 바뀌면 종합 대시보드(final)도 갱신
  if(secId.indexOf('ax_')===0){
    const fi=ss.findIndex(s=>s.tp==='final');
    if(fi>=0){const fEl=document.getElementById('sec-'+ss[fi].id);if(fEl)fEl.replaceWith(renderSectionCard(ss[fi],fi))}
  }
}
function updateNav(){
  const pills=document.querySelectorAll('.nav-pill');
  const ss=getSections();
  pills.forEach((pill,i)=>{
    const filled=isSectionFilled(ss[i]);
    pill.className='nav-pill'+(i===activeNav?' active':'')+(filled&&i!==activeNav?' filled':'');
  });
  updateProgress();
}
function updateSubmitBar(){
  const btn=document.getElementById('submitBtn');const info=document.getElementById('submitInfo');
  if(!btn||!info)return;
  const fc=filledCount(),total=getSections().length;
  btn.disabled=!allFilled()||saving;
  btn.textContent=saving?'저장 중...':'제출하기 ✓';
  info.innerHTML=fc===total?'<span class="done-count">✓ 모든 섹션 작성 완료</span>':'작성 완료 <span class="count">'+fc+' / '+total+'</span> 섹션';
}
function updateProgress(){
  const bar=document.getElementById('progressFill');if(!bar)return;
  const fc=filledCount(),total=getSections().length;
  bar.style.width=(fc/total*100)+'%';
}
function setupScrollSpy(){
  const ss=getSections();
  const observer=new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        const id=entry.target.id.replace('sec-','');
        const idx=ss.findIndex(s=>s.id===id);
        if(idx>=0&&idx!==activeNav){
          activeNav=idx;updateNav();
          const pill=document.querySelectorAll('.nav-pill')[idx];
          if(pill)pill.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
        }
      }
    });
  },{rootMargin:'-120px 0px -60% 0px',threshold:0.1});
  ss.forEach(s=>{const el=document.getElementById('sec-'+s.id);if(el)observer.observe(el)});
}

    const i2=h('div');const l2=h('span',null,'마무리 리뷰');
    if(hasDraft('final',mode))l2.appendChild(h('span',{className:'draft-badge'},'임시저장 있음'));
    i2.appendChild(l2);i2.appendChild(h('div',{className:'desc'},'수습 종료 시점 · 목표 달성 평가 + 본채용 의견'));
    b2.appendChild(i2);b2.appendChild(h('span',{className:'arrow'},'→'));inner.appendChild(b2);
    ld.appendChild(inner);app.appendChild(ld);return;
  }
  // Submitted
  if(submitted){
    const dn=h('div',{className:'done'}),inner=h('div',{style:{maxWidth:'420px'}});
    inner.appendChild(h('div',{className:'icon'},'✅'));
    inner.appendChild(h('h2',null,'제출 완료'));
    const label=(phase==='mid'?'중간':'마무리')+' '+(mode==='self'?'셀프 리뷰':mode==='lead'?'리드 평가':'동료 평가');
    inner.appendChild(h('p',null,label+'가 성공적으로 제출되었습니다.'));
    inner.appendChild(h('button',{onClick:()=>{phase=null;D={};submitted=false;activeNav=0;R()}},'처음으로 돌아가기'));
    dn.appendChild(inner);app.appendChild(dn);return;
  }
  // ═══ FORM ═══
  const ss=getSections();
  const modeLabel=(mode==='self'?'셀프 리뷰':mode==='lead'?'리드 평가':'동료 평가');
  // Header
  const hdr=h('div',{className:'header'}),hi=h('div',{className:'header-inner'}),tp=h('div',{className:'top'}),ld2=h('div');
  ld2.appendChild(h('div',{className:'brand'},'GNA COMPANY · 온보딩 리뷰'));
  ld2.appendChild(h('h2',null,(phase==='mid'?'중간 리뷰':'마무리 리뷰')+' · '+modeLabel));
  tp.appendChild(ld2);
  const btns=h('div',{className:'header-btns'});
  btns.appendChild(h('button',{className:'save-btn',onClick:()=>{saveDraft();showToast('💾 임시저장 완료')}},'임시저장'));
  btns.appendChild(h('button',{className:'exit-btn',onClick:()=>{saveDraft();if(confirm('임시저장 후 나가시겠습니까?')){phase=null;activeNav=0;R()}}},'나가기'));
  tp.appendChild(btns);hi.appendChild(tp);
  const pb=h('div',{className:'progress-bar'});pb.appendChild(h('div',{className:'progress-fill',id:'progressFill',style:{width:(filledCount()/ss.length*100)+'%'}}));
  hi.appendChild(pb);hdr.appendChild(hi);app.appendChild(hdr);
  // Nav pills
  const nav=h('div',{className:'section-nav'}),navIn=h('div',{className:'nav-inner'});
  ss.forEach((sec,i)=>{
    const filled=isSectionFilled(sec);
    const pill=h('button',{className:'nav-pill'+(i===0?' active':'')+(filled?' filled':''),
      onClick:()=>{activeNav=i;const target=document.getElementById('sec-'+sec.id);if(target)target.scrollIntoView({behavior:'smooth',block:'start'});updateNav();}
    },sec.nav||sec.t);
    navIn.appendChild(pill);
  });
  nav.appendChild(navIn);app.appendChild(nav);
  // Content
  const ct=h('div',{className:'content'});
  // Phase banner
  const banner=h('div',{className:'phase-banner'});
  banner.appendChild(h('div',{className:'pb-t'},phase==='mid'?'🌱 수습 중간 리뷰':'🎯 수습 마무리 리뷰'));
  banner.appendChild(h('div',{className:'pb-d'},phase==='mid'?'입사 후 2주 내 리드와 설정한 수습 목표의 진행 상황을 중간 점검합니다.':'중간 리뷰에서 점검한 수습 목표의 최종 달성도를 평가하고 본채용 적합 여부를 판단합니다.'));
  ct.appendChild(banner);
  ss.forEach((sec,idx)=>{
    ct.appendChild(renderSectionCard(sec,idx));
    if(idx<ss.length-1)ct.appendChild(h('div',{className:'section-divider'}));
  });
  app.appendChild(ct);
  // Submit bar
  const sb=h('div',{className:'submit-bar'}),si=h('div',{className:'submit-inner'});
  const fc=filledCount();
  const infoEl=h('div',{className:'submit-info',id:'submitInfo'});
  infoEl.innerHTML=fc===ss.length?'<span class="done-count">✓ 모든 섹션 작성 완료</span>':'작성 완료 <span class="count">'+fc+' / '+ss.length+'</span> 섹션';
  si.appendChild(infoEl);
  const submitBtn=h('button',{className:'btn-submit',id:'submitBtn',onClick:submit},'제출하기 ✓');
  if(!allFilled())submitBtn.disabled=true;
  si.appendChild(submitBtn);
  sb.appendChild(si);app.appendChild(sb);
  requestAnimationFrame(()=>setupScrollSpy());
}
R();
</script>
</body>
</html>
